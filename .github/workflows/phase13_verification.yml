name: Phase 13 Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af2

      - name: Set up Python
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run test suite
        run: python -m pytest -q --tb=short

      - name: Verify dataset checksum
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = "58d1866b7a01519593b68c9c929007d10051d070aa957773589f136065cc5f1c"
          actual = hashlib.sha256(Path("data/Crop_Yield_original.csv").read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"Dataset checksum mismatch: {actual}")
          print(f"Dataset checksum verified: {actual}")
          PY

      - name: Verify Phase 9 decisions and evidence
        run: python audit/Phase12_Audit/phase12_checks.py

      - name: Compile dashboard
        run: python -m py_compile dashboard/app.py

      - name: Dependency vulnerability audit
        run: |
          mkdir -p audit/Phase13
          python -m pip_audit --requirement requirements.txt --no-deps --disable-pip --format json --output audit/Phase13/pip-audit.json --progress-spinner off --timeout 60
          python -m pip_audit --requirement requirements.txt --no-deps --disable-pip --format markdown --output audit/Phase13/pip-audit.md --progress-spinner off --timeout 60

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: phase13-verification-${{ github.sha }}
          path: |
            audit/Phase13/
            .pytest_cache/
          if-no-files-found: ignore
